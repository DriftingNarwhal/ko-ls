[workspace]
resolver = "3"
members = ["crates/kols-core", "crates/kols-net", "crates/kols-api", "crates/kols-cli", "crates/kols-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
intranet-crypto = { path = "../distributed-intranet/crates/intranet-crypto" }
intranet-identity = { path = "../distributed-intranet/crates/intranet-identity" }
intranet-governance = { path = "../distributed-intranet/crates/intranet-governance" }
intranet-storage = { path = "../distributed-intranet/crates/intranet-storage" }
intranet-transport = { path = "../distributed-intranet/crates/intranet-transport" }
intranet-ledger = { path = "../distributed-intranet/crates/intranet-ledger" }
intranet-epoch = { path = "../distributed-intranet/crates/intranet-epoch" }
intranet-invite = { path = "../distributed-intranet/crates/intranet-invite" }
libp2p = "0.56"
kols-core = { path = "crates/kols-core" }
kols-net = { path = "crates/kols-net" }
kols-api = { path = "crates/kols-api" }
kols-cli = { path = "crates/kols-cli" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", default-features = false }

# Debug builds here are dominated by debug information, not code: a test binary
# statically links libp2p, quinn, rustls and openmls, and 83% of the 369 MB one
# measured was DWARF — `.debug_str` alone was 182 MB. Every integration test is
# its own binary carrying its own copy of that, so the target directory reached
# tens of gigabytes in a couple of days of ordinary work.
#
# `line-tables-only` keeps what this project actually reads — file and line in a
# backtrace, and a panic location that means something — and drops the type and
# variable descriptions a stepping debugger would want. `unpacked` leaves the
# rest in object files instead of copying it into every test binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies get no debug information at all, which is a second cut at the
# same problem and became worth making when `kols-app` arrived: Tauri pulls
# webkit, wry, tao, gtk and their bindings, and the debug information for that
# tree dwarfs the code. Our own crates keep line tables, so a backtrace still
# points at a file and line in this repo — which is what a failing test is read
# through. A line number inside a GTK binding has never been the thing that
# explained a failure here.
[profile.dev.package."*"]
debug = false
