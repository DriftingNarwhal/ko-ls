# The gate, on every push: the same two commands CLAUDE.md and STATUS name.
#
# It runs on Windows as well as Linux, and that is the point rather than a
# flourish. The client has platform-specific code — `kols-cli::secret` restricts
# a seed differently on each — and the two bugs the first Windows run found were
# both invisible from a Linux container. A gate that only ever ran on the
# development machine would have shipped them again.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    strategy:
      # Not fail-fast: when one platform breaks, the useful question is whether
      # the other did too, and cancelling the answer to save a runner-minute is
      # a poor trade.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Both repos, as siblings. The client depends on the protocol by *path*
      # while the extensions still move (STATUS §0), so a checkout of this repo
      # alone cannot build — `../distributed-intranet` has to be there too.
      #
      # The token falls back deliberately, and the fallback is now the live
      # path: all three repos are public, so the job's own token reads the
      # protocol repo and no secret is involved. `PROTOCOL_REPO_TOKEN` stays
      # supported because a repository's visibility is a decision somebody may
      # revisit, and this way that decision stays a repository setting rather
      # than an edit to every workflow that checks it out.
      # Why this step exists: without it, a missing or under-scoped token shows up
      # as `actions/checkout` reporting **404 Not Found** on the next step, which
      # is GitHub declining to confirm that a private repository exists at all.
      # That reads as "the repo is gone" and means "this token cannot see it".
      # Naming the cause here costs one API call.
      - name: Can we see the protocol repo?
        shell: bash
        env:
          PROTOCOL_TOKEN: ${{ secrets.PROTOCOL_REPO_TOKEN }}
          FALLBACK: ${{ github.token }}
        run: |
          if [ -n "$PROTOCOL_TOKEN" ]; then
            using="PROTOCOL_REPO_TOKEN"; token="$PROTOCOL_TOKEN"
          else
            using="this job's own token (PROTOCOL_REPO_TOKEN is not set)"; token="$FALLBACK"
          fi
          # An *empty* Authorization header is a bad credential rather than no
          # credential — GitHub answers 401 to it even for a public repository —
          # so the header is omitted when there is no token to send.
          auth=()
          [ -n "$token" ] && auth=(-H "Authorization: Bearer $token")
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${auth[@]}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/DriftingNarwhal/distributed-intranet)
          echo "Using $using — GitHub answered $code."
          if [ "$code" = "200" ]; then exit 0; fi
          echo "::error::Cannot read DriftingNarwhal/distributed-intranet using $using (HTTP $code)."
          cat >&2 <<'WHY'

          The client depends on the protocol crates by path, so this workflow has to
          check out both repositories as siblings. A job's own token reaches only the
          repository it runs in, so if distributed-intranet is private a PAT is
          required:

            Settings -> Secrets and variables -> Actions -> New repository secret
              Name:  PROTOCOL_REPO_TOKEN
              Value: a token that can read DriftingNarwhal/distributed-intranet

            Fine-grained PAT: Repository access must list distributed-intranet, and
            Repository permissions must include Contents: Read-only.
            Classic PAT: the `repo` scope.

          A 404 here means the token cannot see the repository, not that it is
          missing — GitHub returns 404 rather than 403 for private repositories so
          that their existence is not disclosed. A 401 means the token is invalid or
          expired.

          When distributed-intranet becomes public, delete the secret: both workflows
          fall back to the job's own token, which can read any public repository.
          WHY
          exit 1

      - uses: actions/checkout@v4
        with:
          path: ko-ls
      - uses: actions/checkout@v4
        with:
          repository: DriftingNarwhal/distributed-intranet
          token: ${{ secrets.PROTOCOL_REPO_TOKEN || github.token }}
          path: distributed-intranet

      - name: Toolchain
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ko-ls

      # What `.devcontainer/Dockerfile` installs for the same reason: Tauri v2
      # links against webkit2gtk 4.1 here, and the tray library Debian and Ubuntu
      # ship is the Ayatana fork rather than `libappindicator3-dev`. macOS needs
      # no equivalent — WebKit is the system's — and Windows uses WebView2, which
      # the runner image already carries.
      - name: GTK and webview, for kols-app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Windows Defender is the difference between the two platforms here, and
      # it is not a small one. Real-time scanning inspects an executable on each
      # launch and every file written under the tree; this suite launches a
      # **76 MB debug binary around a hundred times** and its daemons write many
      # small files per tick. Linux pays neither cost.
      #
      # The evidence that this rather than the machine is the problem: pinned to
      # four cores, the same suite passes on Linux in 83 seconds, and it failed
      # six tests in 335 on a four-core Windows runner. Same width, different
      # answer, so the difference is per-operation cost and not parallelism.
      #
      # Runners are administrators, so this is permitted; it is tolerated
      # failing because a runner image with Defender already off should not fail
      # the gate for refusing to turn it off twice.
      - name: Take Defender off the build tree
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", $env:TEMP)) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          foreach ($proc in @("kols.exe", "kols-desktop.exe", "cargo.exe", "rustc.exe")) {
            Add-MpPreference -ExclusionProcess $proc -ErrorAction SilentlyContinue
          }
          Write-Host "Exclusions requested."

      # So a slow run says how much machine it had, rather than leaving the next
      # person to infer it from the failure.
      - name: What machine is this?
        shell: bash
        run: |
          echo "os: ${{ runner.os }}"
          echo "cores: $(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"

      - name: Tests
        working-directory: ko-ls
        run: cargo test --workspace

      - name: Clippy
        working-directory: ko-ls
        run: cargo clippy --workspace --all-targets -- -D warnings
