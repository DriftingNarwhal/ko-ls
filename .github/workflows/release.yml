# Desktop binaries, built where they run, published to a GitHub release.
#
# # Built natively rather than cross-compiled, and that is not fastidiousness
#
# The first Windows binaries were cross-compiled from the Linux dev container
# with mingw. That worked and cost something at the far end: a GNU build
# *imports* `WebView2Loader.dll` rather than linking the loader in, so the window
# would not start unless that DLL was copied alongside it. An MSVC build on a
# Windows runner has no such tail. macOS cannot be cross-compiled from Linux at
# all without an SDK nobody may redistribute, so it was simply absent until
# there was somewhere to build it.
#
# # What comes out
#
# Portable binaries for each platform, plus an installer where the platform has
# a normal one. `kols` is the terminal client and `kols-desktop` the window.
name: release

# # Action versions are pinned to the lowest major that runs Node 24
#
# GitHub deprecated the Node 20 action runtime, which every build warned about.
# The fix is a runtime bump, so these are bumped to the first major of each
# action that carries one — deliberately not to the newest, because the newest
# of two of them also changes behaviour this workflow depends on.
#
# `download-artifact` v8 stops unzipping unconditionally and decides from the
# `Content-Type` instead. The publish job below downloads every artifact and
# hands `find artifacts -type f` straight to `gh release create`, so a change in
# what lands on disk changes what ends up attached to the release — quietly, and
# only visible to somebody downloading a zip where they expected a binary. v7 is
# the same action on Node 24 and nothing else. `checkout` v6 and v7 likewise
# change PR-checkout behaviour this workflow never exercises.
#
# `Swatinem/rust-cache@v2` already runs on Node 24 and needs no change.

# Only when a build is wanted: a `v*` tag publishes one, and a manual dispatch
# produces the artifacts without publishing. Deliberately not on every push —
# nothing here belongs on the path of an ordinary commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundle: nsis
          - os: macos-latest
            name: macos-arm64
            bundle: dmg
          - os: macos-13
            name: macos-x64
            bundle: dmg
    runs-on: ${{ matrix.os }}

    steps:
      # Both repos, because the client depends on the protocol by path — a
      # checkout of this one alone cannot build. Both are public, so the default
      # token reaches them and PROTOCOL_REPO_TOKEN is a leftover for the case
      # where either goes private again.
      - uses: actions/checkout@v5
        with:
          path: ko-ls
      - uses: actions/checkout@v5
        with:
          repository: DriftingNarwhal/distributed-intranet
          token: ${{ secrets.PROTOCOL_REPO_TOKEN || github.token }}
          path: distributed-intranet

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ko-ls
          key: ${{ matrix.name }}

      # Real-time scanning inspects every object file a release build writes,
      # and this dependency tree is large. Tolerated failing: an image with
      # Defender already off should not fail the build for refusing twice.
      - name: Take Defender off the build tree
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo")) {
            Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          }
          foreach ($proc in @("cargo.exe", "rustc.exe", "link.exe")) {
            Add-MpPreference -ExclusionProcess $proc -ErrorAction SilentlyContinue
          }

      # The tests that can only run here, run here — and only as part of a
      # build.
      #
      # **Not a gate.** The suite runs in the development container, where the
      # output is complete and a failure can be reproduced in the same minute it
      # appears. What that container cannot do is execute on Windows or macOS,
      # and the client has real platform-specific code: `kols-cli::secret`
      # restricts a seed with a chmod on Unix and a protected DACL on Windows,
      # and `Store::default_root` reads `USERPROFILE` on one and `HOME` on the
      # other. Both of those were wrong, and both were invisible from Linux.
      #
      # So this is the narrow set: the store, the seed's permissions, and the
      # paths. Deliberately **not** the `two_nodes` daemon suite, which tests
      # merge, gossip and backfill — none of it platform-specific, all of it
      # timing-sensitive, and all of it already proven in the container on a
      # deliberately starved machine.
      - name: Platform tests
        working-directory: ko-ls
        run: cargo test -p kols-cli --lib

      - name: Build
        working-directory: ko-ls
        run: cargo build --release --bin kols --bin kols-desktop

      # The one thing that can only be checked where it runs: that a seed the
      # built binary writes is readable by its owner and by nobody else.
      #
      # This checks the **artifact**, not the source, and it has to: the Rust
      # tests for this are `#[cfg(all(test, unix))]`, so the Windows DACL path
      # compiles out of them entirely and a `cargo test` leg on Windows would
      # prove nothing about the one function written specifically for Windows.
      # It was written blind against an API contract and confirmed once, by hand,
      # by a person looking at a Properties dialog. This is that check, kept.
      - name: A seed is readable by nobody else (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "kols-smoke"
          $env:KOLS_HOME = $home_dir
          & "ko-ls\target\release\kols.exe" init smoke
          $seed = Join-Path $home_dir "seed"
          if (-not (Test-Path $seed)) { throw "no seed was written at $seed" }
          $acl = Get-Acl $seed
          if (-not $acl.AreAccessRulesProtected) {
            throw "the seed's DACL is not protected, so it inherits from its directory"
          }
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          foreach ($rule in $acl.Access) {
            if ($rule.IdentityReference.Value -ne $me) {
              throw "the seed grants $($rule.IdentityReference.Value), not just $me"
            }
          }
          Write-Host "seed grants only $me, inheritance off"
          Remove-Item -Recurse -Force $home_dir

      - name: A seed is readable by nobody else (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export KOLS_HOME="$RUNNER_TEMP/kols-smoke"
          ko-ls/target/release/kols init smoke
          mode=$(stat -f "%Lp" "$KOLS_HOME/seed")
          echo "seed mode: $mode"
          [ "$mode" = "600" ] || { echo "a seed at mode $mode is readable beyond its owner"; exit 1; }
          rm -rf "$KOLS_HOME"

      # The npm package installs a `tauri` binary. `cargo tauri` is the other
      # distribution of the same CLI and is not this one.
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # `bundle.active` is false in tauri.conf.json, because an ordinary
      # `cargo build` has no business producing an installer. It is asked for
      # here instead of turned on there.
      - name: Installer
        working-directory: ko-ls/crates/kols-app
        run: tauri build --bundles ${{ matrix.bundle }}
        continue-on-error: true

      - name: Collect
        working-directory: ko-ls
        shell: bash
        run: |
          mkdir -p out
          for binary in kols kols-desktop; do
            if [ -f "target/release/$binary.exe" ]; then
              cp "target/release/$binary.exe" "out/"
            else
              cp "target/release/$binary" "out/"
            fi
          done
          # Best-effort: the portable binaries are the deliverable that must not
          # fail, and a bundler that cannot run should not take them down with it.
          find target/release/bundle -type f \( -name "*-setup.exe" -o -name "*.dmg" \) \
            -exec cp {} out/ \; 2>/dev/null || true
          # Named per platform, because every one of these produces a `kols` and
          # they would otherwise overwrite each other in the release.
          cd out && for f in *; do mv "$f" "${{ matrix.name }}-$f"; done
          ls -la

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ko-ls/out/*

  # Publishing is its own job so that three matrix legs do not race to create one
  # release. A manual run stops after `build` and leaves the artifacts, which is
  # how to exercise this without publishing anything.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f -exec ls -la {} \;
          gh release create "${GITHUB_REF_NAME}" $(find artifacts -type f) \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "\`kols-desktop\` is the window and \`kols\` the terminal client. Both are portable; the installers are optional.

          **Windows** needs the WebView2 runtime, which ships with Windows 11 and current Windows 10.

          **macOS** builds are unsigned, so Gatekeeper will refuse them on first run: open the app from the right-click menu once, or \`xattr -d com.apple.quarantine <file>\`. Signing needs a developer certificate this project does not have."
