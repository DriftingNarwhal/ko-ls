[package]
name = "kols-node"
description = "The node, store and command executor behind ko-ls — plus `kols`, a development client over the same boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "kols_node"
path = "src/lib.rs"

[[bin]]
name = "kols"
path = "src/main.rs"

[dependencies]
kols-core.workspace = true
kols-net.workspace = true
kols-api.workspace = true
intranet-crypto.workspace = true
intranet-identity.workspace = true
intranet-governance.workspace = true
intranet-ledger.workspace = true
intranet-storage.workspace = true
intranet-epoch.workspace = true
intranet-invite.workspace = true
intranet-transport.workspace = true

clap.workspace = true
libp2p.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# Only to restrict a secret to its owner on Windows (`src/secret.rs`). Unix does
# this with a chmod and needs nothing; Windows needs a DACL, and there is no
# safe wrapper for that in the standard library.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
