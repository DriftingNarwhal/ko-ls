[package]
name = "kols-app"
description = "The desktop shell — a window over the ko-ls API boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kols-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kols-api.workspace = true
kols-node.workspace = true
kols-core.workspace = true
intranet-crypto.workspace = true
intranet-governance.workspace = true
intranet-identity.workspace = true

tauri = { version = "2", features = [] }
# For the bounded wait in `stop_node` and nothing else. Already in the tree via
# `kols-node`; this is the edge being declared rather than a new dependency.
tokio = { workspace = true, features = ["time"] }
serde = { version = "1", features = ["derive"] }
