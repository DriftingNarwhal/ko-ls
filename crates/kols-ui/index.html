<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ko-ls</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Every element a theme may restyle lives under `data-kols`, so a theme can
         reach a part by what it is rather than by guessing at class names that
         change. `design/09` §6 allows full restyling including layout. -->
    <div class="app" data-kols="app">
      <aside class="rail" data-kols="rail">
        <!-- Question 1: which network am I in? -->
        <header class="network" data-kols="network">
          <h1 id="network-label">…</h1>
          <p class="mono" id="network-id"></p>
          <p class="you">
            you are <span id="you-name">…</span>
            <span class="mono" id="identity"></span>
          </p>
        </header>

        <!-- Question 2: what channels are here, and which am I reading? -->
        <nav class="channels" data-kols="channels">
          <div class="channels-head">
            <h2>channels</h2>
            <!-- Question 4: shown only where the capability is held. Hiding is
                 presentation; the command is re-checked on receipt regardless. -->
            <button id="new-channel" hidden title="define a channel">+</button>
          </div>
          <ul id="channel-list"></ul>
        </nav>

        <footer class="state" data-kols="state">
          <p id="key-state"></p>
        </footer>
      </aside>

      <main class="channel" data-kys="channel" data-kols="channel">
        <header class="channel-head" data-kols="channel-head">
          <h2 id="channel-name">no channel</h2>
          <p id="channel-topic"></p>
        </header>

        <ol class="messages" id="messages" data-kols="messages"></ol>

        <div class="refused" id="refused" hidden data-kols="refused"></div>

        <form class="composer" id="composer" data-kols="composer" hidden>
          <input
            id="body"
            type="text"
            autocomplete="off"
            placeholder="write something"
          />
          <button type="submit">send</button>
        </form>
        <p class="composer-denied" id="composer-denied" hidden>
          you may not post here
        </p>

        <!-- Claiming a name is the member's own act, so nothing does it at
             admission and the composer waits until they have. -->
        <form class="namer" id="namer" data-kols="namer" hidden>
          <label for="name">pick a name before you post</label>
          <div class="namer-row">
            <input id="name" type="text" autocomplete="off" placeholder="a name" />
            <button type="submit">claim</button>
          </div>
          <p class="namer-note">
            Unique here, and yours permanently — it stays bound to you even if you
            claim another, so nobody inherits it and what you wrote with it.
          </p>
        </form>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
